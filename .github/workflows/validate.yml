name: Validate marketplace catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Minisign verifier
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - name: Validate directory and release assets
        run: python3 tools/validate_marketplace.py
